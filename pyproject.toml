[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-provenance"
version = "0.2.0"
description = "GRASP — Governed Reasoning And Signable Provenance. Reference implementation of cryptographic causation for AI: signed decision records (IDR), a signed memory/belief chain, a deterministic citation-provenance floor (cite.verify), and a signed legal filing gate."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CodeTonight SA" }]
keywords = [
  "provenance",
  "ai-audit",
  "merkle",
  "tamper-evident",
  "citation-verification",
  "decision-records",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/CodeTonight-SA/grasp"

[project.optional-dependencies]
# Ed25519 + ML-DSA-65 (FIPS 204) asymmetric signing. Optional: the hermetic
# HMAC-SHA256 core runs with zero dependencies; asymmetric schemes degrade
# (DEGRADED) rather than crash when this is absent.
pqc = ["cryptography>=44"]
# C2PA manifest bridge (roadmap item 6): embed GRASP content addresses inside
# C2PA manifests. Optional; the bridge degrades with a clear C2paUnavailable
# when absent. Signing needs a real C2PA signer credential.
c2pa = ["c2pa-python>=0.35"]

[project.scripts]
grasp = "grasp.cli:main"
grasp-prove-it = "grasp.prove_it:main"
grasp-legal-receipt = "grasp.legal_receipt:main"
grasp-mcp = "grasp.mcp_server:main"

[tool.setuptools]
packages = ["grasp", "grasp.storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
